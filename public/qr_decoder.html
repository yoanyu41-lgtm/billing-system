<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KHQR QR Code Decoder</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .card { background: white; border-radius: 16px; padding: 32px; max-width: 600px; width: 100%; box-shadow: 0 4px 24px rgba(0,0,0,0.10); }
  h1 { font-size: 20px; font-weight: 700; color: #1e3a8a; margin-bottom: 6px; }
  p.sub { color: #64748b; font-size: 13px; margin-bottom: 24px; }
  .drop-zone { border: 2.5px dashed #93c5fd; border-radius: 12px; background: #eff6ff; padding: 36px 20px; text-align: center; cursor: pointer; transition: background 0.2s; }
  .drop-zone:hover, .drop-zone.drag { background: #dbeafe; border-color: #3b82f6; }
  .drop-zone input[type=file] { display: none; }
  .drop-zone label { cursor: pointer; display: block; }
  .drop-zone .icon { font-size: 40px; margin-bottom: 10px; }
  .drop-zone .hint { color: #3b82f6; font-size: 14px; font-weight: 600; }
  .drop-zone .sub2 { color: #94a3b8; font-size: 12px; margin-top: 4px; }
  #preview-wrap { display: none; margin: 16px 0; text-align: center; }
  #preview-wrap img { max-height: 200px; border-radius: 10px; border: 1px solid #e2e8f0; }
  #result-box { display: none; margin-top: 20px; }
  #result-box label { font-size: 13px; font-weight: 600; color: #374151; display: block; margin-bottom: 6px; }
  #result-text { width: 100%; border: 1.5px solid #6366f1; border-radius: 10px; padding: 12px; font-size: 12px; font-family: monospace; color: #1e293b; background: #f8faff; resize: vertical; min-height: 80px; }
  #copy-btn { margin-top: 10px; background: #4f46e5; color: white; border: none; border-radius: 8px; padding: 10px 20px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  #copy-btn:hover { background: #4338ca; }
  #copy-btn.copied { background: #16a34a; }
  .tag-table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12px; }
  .tag-table th { background: #f1f5f9; color: #475569; font-weight: 600; padding: 8px 10px; text-align: left; border-radius: 4px; }
  .tag-table td { padding: 7px 10px; border-bottom: 1px solid #f1f5f9; color: #334155; }
  .tag-table tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-merchant { background: #dcfce7; color: #16a34a; }
  .badge-p2p { background: #fef9c3; color: #ca8a04; }
  #error-box { display: none; margin-top: 16px; background: #fee2e2; color: #dc2626; border-radius: 10px; padding: 12px 16px; font-size: 13px; }
  .loading { display: none; text-align: center; margin-top: 20px; color: #6366f1; font-size: 14px; }
  .paste-hint { background: #f0fdf4; border: 1.5px solid #86efac; border-radius: 10px; padding: 14px; margin-top: 20px; }
  .paste-hint p { font-size: 13px; color: #15803d; font-weight: 600; margin-bottom: 4px; }
  .paste-hint code { font-size: 11px; color: #166534; word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <h1>🔍 KHQR Decoder</h1>
  <p class="sub">Upload QR Code Image ហើយ Decode ចេញ KHQR Payload Text ដើម្បី Paste ចូល Settings</p>

  <div class="drop-zone" id="drop-zone">
    <input type="file" id="file-input" accept="image/*">
    <label for="file-input">
      <div class="icon">📷</div>
      <div class="hint">ចុចដើម្បីជ្រើស ឬ Drag & Drop QR Image</div>
      <div class="sub2">Supports JPG, PNG, GIF, BMP, WebP</div>
    </label>
  </div>

  <div id="preview-wrap">
    <img id="preview-img" src="" alt="QR Preview">
  </div>

  <div class="loading" id="loading">⏳ Decoding QR Code...</div>
  <div id="error-box"></div>

  <div id="result-box">
    <label>✅ Decoded KHQR Payload (Copy → Paste ចូល Settings):</label>
    <textarea id="result-text" readonly></textarea>
    <button id="copy-btn" onclick="copyPayload()">📋 Copy Payload</button>
    <div class="paste-hint" id="paste-hint" style="display:none">
      <p>📌 បន្ទាប់ Paste ចូល Settings → KHQR Payload Text</p>
      <code id="paste-preview"></code>
    </div>
    <table class="tag-table" id="tag-table">
      <thead><tr><th>Tag</th><th>Value</th></tr></thead>
      <tbody id="tag-body"></tbody>
    </table>
  </div>
</div>

<!-- Use jsQR via CDN -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag');
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) processFile(file);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) processFile(e.target.files[0]); });

  function processFile(file) {
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = document.getElementById('preview-img');
      img.src = ev.target.result;
      document.getElementById('preview-wrap').style.display = 'block';
      document.getElementById('loading').style.display = 'block';
      document.getElementById('result-box').style.display = 'none';
      document.getElementById('error-box').style.display = 'none';
      img.onload = () => decodeQR(img);
    };
    reader.readAsDataURL(file);
  }

  function decodeQR(img) {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
    document.getElementById('loading').style.display = 'none';

    if (code && code.data) {
      showResult(code.data);
    } else {
      // Try with inverted colors
      const code2 = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'onlyInvert' });
      if (code2 && code2.data) {
        showResult(code2.data);
      } else {
        document.getElementById('error-box').style.display = 'block';
        document.getElementById('error-box').innerHTML = '❌ មិន​អាច Decode QR Code បានទេ។ សូមអ្នកប្រាកដថារូបភាពច្បាស់លាស់ ហើយ QR Code ត្រឹមត្រូវ។';
      }
    }
  }

  function showResult(payload) {
    document.getElementById('result-text').value = payload;
    document.getElementById('result-box').style.display = 'block';

    // Show paste hint
    document.getElementById('paste-hint').style.display = 'block';
    document.getElementById('paste-preview').textContent = payload.substring(0, 80) + (payload.length > 80 ? '...' : '');

    // Parse tags
    const tags = parseEMVCo(payload);
    const tbody = document.getElementById('tag-body');
    tbody.innerHTML = '';
    
    const tagNames = {
      '00': 'Payload Format Indicator',
      '01': 'Point of Initiation (11=Static, 12=Dynamic)',
      '29': 'KHQR Merchant Info ✅',
      '30': 'KHQR P2P Info',
      '52': 'MCC (Merchant Category Code)',
      '53': 'Currency (840=USD, 116=KHR)',
      '54': 'Amount',
      '58': 'Country Code',
      '59': 'Merchant Name',
      '60': 'Merchant City',
      '62': 'Additional Data',
      '63': 'CRC Checksum',
    };

    for (const [tag, value] of Object.entries(tags)) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><strong>Tag ${tag}</strong> — ${tagNames[tag] || ''}</td><td>${value}</td>`;
      tbody.appendChild(tr);
    }

    // Show account type badge
    const typeRow = document.createElement('tr');
    const isP2P = !!tags['30'];
    const badgeClass = isP2P ? 'badge-p2p' : 'badge-merchant';
    const badgeText = isP2P ? '⚠️ P2P Personal (Amount auto-fill ❌)' : '✅ KHQR Merchant (Amount auto-fill ✅)';
    typeRow.innerHTML = `<td><strong>Account Type</strong></td><td><span class="badge ${badgeClass}">${badgeText}</span></td>`;
    tbody.insertBefore(typeRow, tbody.firstChild);
  }

  function parseEMVCo(payload) {
    const tags = {};
    let i = 0;
    while (i < payload.length - 4) {
      const tag = payload.substring(i, i + 2);
      const len = parseInt(payload.substring(i + 2, i + 4), 10);
      if (isNaN(len) || i + 4 + len > payload.length) break;
      const value = payload.substring(i + 4, i + 4 + len);
      tags[tag] = value;
      i += 4 + len;
    }
    return tags;
  }

  function copyPayload() {
    const text = document.getElementById('result-text').value;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✅ Copied!';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = '📋 Copy Payload'; btn.classList.remove('copied'); }, 2000);
    });
  }
</script>
</body>
</html>
